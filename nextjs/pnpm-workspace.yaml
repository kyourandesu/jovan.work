packages:
  - .
allowBuilds:
  '@met4citizen/headtts': set this to true or false
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
# These packages ship optional native/postinstall build scripts we don't need
# for a browser-first app (inference runs via onnxruntime-web / WASM in the
# client). Intentionally skipped so `pnpm install` doesn't error.
ignoredBuiltDependencies:
  - '@met4citizen/headtts'
  - onnxruntime-node
  - protobufjs
  - sharp
  - unrs-resolver
